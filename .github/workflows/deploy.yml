name: Deploy to GitHub Pages

# Manual-only by owner decision 2026-10-13 (Actions spending limit). PUSHING TO
# MAIN NO LONGER PUBLISHES THE SITE: docs.radmodules.dev changes only when this
# workflow is started with "Run workflow" or `gh workflow run deploy.yml`.
# Check the build locally first with `bash scripts/ci-local.sh` (it never publishes).
on:
  workflow_dispatch:
    inputs:
      indexnow:
        description: 'After deploying, submit changed doc URLs to IndexNow'
        type: boolean
        default: true
      indexnow_base:
        description: 'Submit URLs of docs changed since this git ref (default HEAD^ = the latest commit only; use the commit of the previous publish to cover several pushes)'
        default: 'HEAD^'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Docusaurus can derive accurate git-based
          # lastmod (sitemap) and "Last updated" timestamps per doc.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build website
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Notify Bing/Yandex (and anything else consuming IndexNow) of the URLs
  # whose source docs changed since indexnow_base (default: the latest commit).
  # The key is public by design — it is served at
  # https://docs.radmodules.dev/<key>.txt for verification.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.indexnow
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        # The input reaches the script only through env, never interpolated.
        env:
          INDEXNOW_BASE: ${{ inputs.indexnow_base || 'HEAD^' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request

          HOST = 'docs.radmodules.dev'
          KEY = 'b672980f216263395cf9f93280f8edc5'

          base = os.environ['INDEXNOW_BASE']
          if base.startswith('-'):
              print('indexnow_base must be a git ref, not an option; skipping.')
              sys.exit(0)
          try:
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', '--diff-filter=d', base, 'HEAD', '--'],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
          except subprocess.CalledProcessError:
              print('Cannot diff against the requested base ref; skipping.')
              sys.exit(0)

          urls = set()
          for path in changed:
              if path.startswith('docs/') and path.endswith(('.md', '.mdx')):
                  stem = path.rsplit('.', 1)[0]
                  if '/Sample_' in stem:  # unlisted template docs
                      continue
                  urls.add(f'https://{HOST}/{stem}')
              elif path.startswith('src/pages/') and path.endswith(('.md', '.mdx')):
                  stem = path[len('src/pages/'):].rsplit('.', 1)[0]
                  urls.add(f'https://{HOST}/{stem}')
              elif path == 'src/pages/index.tsx':
                  urls.add(f'https://{HOST}/')

          if not urls:
              print('No content URLs changed; nothing to submit.')
              sys.exit(0)

          payload = {
              'host': HOST,
              'key': KEY,
              'keyLocation': f'https://{HOST}/{KEY}.txt',
              'urlList': sorted(urls)[:10000],
          }
          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json; charset=utf-8'},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  print(f'IndexNow: HTTP {res.status} for {len(urls)} URL(s)')
          except urllib.error.HTTPError as e:
              # Non-fatal: indexing pings must never fail the deploy.
              print(f'IndexNow submission failed: HTTP {e.code} {e.read()[:200]}')
          PY
